schema_version: "0.4"

annotation:
  species: human
  genome_build: GRCh38

source:
  expected_filename: MelD_cuTAR_mat.txt
  sha1: e8f581e9462c89daee9fe9da528885ed59768228

io:
  chunk_rows: 64

contract:
  min_spatial_barcode_overlap_fraction: 0.99
  min_reference_feature_overlap_targets: 100
  warn_below_reference_feature_overlap_fraction: 0.90
  min_bed_feature_overlap_fraction: 0.95
  min_frozen_targets: 30

eligibility:
  min_reference_total_counts: 20
  min_reference_detected_cells: 10
  min_reference_detected_fraction: 0.002
  min_reference_samples: 2
  min_spatial_detected_spots: 3

mapping:
  backend: tangram
  device: cuda:0
  random_state: 0
  n_anchors: 2000
  min_reference_fraction: 0.002
  min_spatial_spots: 5
  num_epochs: 200
  density_prior: rna_count_based
  learning_rate: 0.1
  target_batch_size: 64
  min_reference_support_fraction: 0.05
  min_finite_prediction_fraction: 0.95

evaluation:
  random_state: 0
  permutations: 200
  alpha: 0.05
  scale_factor: 10000
  scientific_gate:
    panel: primary_ge6
    min_targets: 100
    min_median_spearman: 0.05
    min_median_detection_auroc: 0.55
    min_median_detection_auprc_lift: 1.25
    min_median_topk_recall_lift: 1.25
    min_directional_passes: 3

comparator:
  panel: primary_ge6
  material_delta:
    pearson: 0.02
    spearman: 0.02
    z_nrmse: 0.02
    detection_auroc: 0.03
    detection_auprc: 0.002
    detection_auprc_lift: 0.25
    topk_recall: 0.02
    topk_recall_lift: 0.25
